apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: weather-api-cnpe-prod

images:
  - name: weather-api
    newTag: "01"

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: weather-api
    path: ingress-host.patch.yaml
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: weather-api
    path: httproute-host.patch.yaml
  - path: replicas.patch.yaml
