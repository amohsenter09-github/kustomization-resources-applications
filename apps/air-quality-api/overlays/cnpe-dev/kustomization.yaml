apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: air-quality-api-cnpe-dev

images:
  - name: air-quality-api
    newTag: "01"

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: air-quality-api
    path: httproute-host.patch.yaml
  - path: image-pull-policy.patch.yaml
